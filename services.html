<!DOCTYPE html><html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خدمات | بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* ================= PAGE ================= */

.page{

    min-height:100vh;

    padding:
        110px
        20px
        70px;

    position:relative;

    background:
        radial-gradient(
            circle at 50% 0%,
            #29251e 0%,
            #111 42%,
            #050505 100%
        );
}


/* ================= CONTAINER ================= */

.container{

    width:90%;

    max-width:1100px;

    margin:0 auto;
}


/* ================= TITLE ================= */

h1{

    margin:0;

    text-align:center;

    font-size:
        clamp(38px,6vw,55px);

    line-height:1.5;

    font-weight:700;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.8);
}

.subtitle{

    text-align:center;

    color:#d4a84f;

    font-size:17px;

    line-height:2;

    margin:
        10px
        0
        45px;
}


/* ================= SERVICES GRID ================= */

.services-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}


/* ================= SERVICE CARD ================= */

.service-card{

    background:
        linear-gradient(
            145deg,
            #181818,
            #0c0c0c
        );

    border:
        1px solid
        rgba(212,168,79,.28);

    border-radius:15px;

    padding:30px;

    min-height:250px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.service-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(212,168,79,.75);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.5);
}


/* ================= NUMBER ================= */

.number{

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:18px;

    background:#d4a84f;

    color:#111;

    border-radius:50%;

    font-size:18px;

    font-weight:bold;
}


/* ================= SERVICE TITLE ================= */

.service-card h2{

    margin:
        0 0 15px;

    color:#d4a84f;

    font-size:20px;

    line-height:1.9;

    font-weight:700;
}


/* ================= SERVICE TEXT ================= */

.service-card p{

    margin:0;

    color:#ddd;

    font-size:15px;

    line-height:2.25;

    text-align:justify;
}


/* ================= LAST CARD ================= */

.service-card:last-child{

    grid-column:
        1 / -1;

    max-width:540px;

    width:100%;

    margin:0 auto;
}


/* ================= HOME BUTTON ================= */

.home{

    display:block;

    width:max-content;

    margin:
        45px
        auto
        0;

    padding:
        15px
        32px;

    background:#d4a84f;

    color:#111;

    border-radius:9px;

    font-weight:bold;

    font-size:15px;

    transition:.25s;
}

.home:hover{

    background:#e2b65d;

    transform:
        translateY(-3px);
}


/* ================= MOBILE ================= */

@media(max-width:750px){

    .page{

        padding:
            95px
            15px
            50px;
    }

    .container{

        width:95%;
    }

    .services-grid{

        grid-template-columns:1fr;

        gap:18px;
    }

    .service-card{

        min-height:auto;

        padding:25px;
    }

    .service-card:last-child{

        grid-column:auto;

        max-width:none;
    }

    .service-card h2{

        font-size:18px;

        line-height:1.8;
    }

    .service-card p{

        font-size:14px;

        line-height:2.2;
    }

    .home{

        width:100%;

        text-align:center;
    }

}
