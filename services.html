<!DOCTYPE html><html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خدمات | بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* ================= صفحه ================= */

.page{
    min-height:100vh;

    padding:110px 20px 60px;

    background:
        radial-gradient(
            circle at top center,
            rgba(212,168,79,.12),
            transparent 38%
        ),
        #080808;
}

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
}


/* ================= عنوان ================= */

h1{
    margin:0;

    text-align:center;

    color:#fff;

    font-size:
        clamp(38px,6vw,55px);

    line-height:1.5;
}

.subtitle{
    text-align:center;

    color:#d4a84f;

    font-size:17px;

    line-height:2;

    margin:
        10px auto 45px;
}


/* ================= کارت خدمات ================= */

.services{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}

.card{

    padding:30px;

    background:
        linear-gradient(
            145deg,
            #191919,
            #0d0d0d
        );

    border:
        1px solid
        rgba(212,168,79,.30);

    border-radius:15px;

    transition:.25s;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.25);
}

.card:hover{

    transform:
        translateY(-5px);

    border-color:#d4a84f;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.45);
}


/* ================= شماره ================= */

.number{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#d4a84f;

    color:#111;

    border-radius:50%;

    font-size:19px;

    font-weight:bold;

    margin-bottom:18px;
}


/* ================= عنوان خدمت ================= */

.card h2{

    margin:
        0 0 15px;

    color:#d4a84f;

    font-size:20px;

    line-height:1.9;
}


/* ================= توضیحات ================= */

.card p{

    margin:0;

    color:#ddd;

    font-size:15px;

    line-height:2.25;
}


/* ================= خدمت پنجم ================= */

.card:last-child{

    grid-column:
        1 / -1;

    width:100%;

    max-width:550px;

    justify-self:center;
}


/* ================= مشاوره ================= */

.consultation{

    margin-top:45px;

    padding:35px 20px;

    text-align:center;

    background:
        rgba(212,168,79,.05);

    border:
        1px solid
        rgba(212,168,79,.30);

    border-radius:15px;
}

.consultation h2{

    margin:
        0 0 12px;

    color:#fff;

    font-size:23px;
}

.consultation p{

    margin:
        0 auto 22px;

    color:#bbb;

    line-height:2;
}

.consultation a{

    display:inline-block;

    padding:
        15px 32px;

    background:#d4a84f;

    color:#111;

    border-radius:8px;

    font-weight:bold;

    transition:.25s;
}

.consultation a:hover{

    transform:
        translateY(-3px);

    background:#e1b35d;
}


/* ================= بازگشت ================= */

.home{

    display:block;

    width:max-content;

    margin:
        30px auto 0;

    padding:
        14px 30px;

    border:
        1px solid
        #d4a84f;

    border-radius:8px;

    color:#d4a84f;

    font-weight:bold;

    transition:.25s;
}

.home:hover{

    background:#d4a84f;

    color:#111;
}


/* ================= موبایل ================= */

@media(max-width:700px){

    .page{

        padding:
            100px 15px 50px;
    }

    .container{
        width:96%;
    }

    .services{

        grid-template-columns:1fr;

    }

    .card{

        padding:24px 20px;

    }

    .card:last-child{

        grid-column:auto;

        max-width:none;

    }

    .card h2{

        font-size:18px;

    }

    .card p{

        font-size:14px;

        line-height
