<!DOCTYPE html><html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خدمات | بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* ================= HEADER ================= */

.header{
    height:80px;
    position:fixed;
    top:0;
    right:0;
    left:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;
}

.logo{
    width:110px;
    height:60px;
    object-fit:contain;
}


/* ================= MENU BUTTON ================= */

.menu-button{
    width:48px;
    height:48px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;

    background:rgba(0,0,0,.75);

    border:1px solid #d4a84f;
    border-radius:8px;

    cursor:pointer;
}

.menu-button span{
    width:23px;
    height:2px;
    display:block;
    background:#d4a84f;
}


/* ================= PAGE ================= */

.page{
    min-height:100vh;

    padding:
        115px
        20px
        70px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(212,168,79,.12),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #151515,
            #080808 55%,
            #030303
        );
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}


/* ================= TITLE ================= */

.page-title{
    text-align:center;
    margin:0;

    font-size:
        clamp(38px,6vw,55px);

    line-height:1.5;

    text-shadow:
        0 5px 25px rgba(0,0,0,.8);
}

.page-subtitle{
    text-align:center;

    color:#d4a84f;

    font-size:17px;

    line-height:2;

    margin:
        8px
        auto
        50px;
}


/* ================= SERVICES GRID ================= */

.services-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}


/* ================= SERVICE CARD ================= */

.service-card{

    position:relative;

    padding:30px;

    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,.98),
            rgba(10,10,10,.98)
        );

    border:
        1px solid
        rgba(212,168,79,.28);

    border-radius:15px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.service-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(212,168,79,.75);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.55);
}


/* شماره خدمت */

.service-number{

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:17px;

    border-radius:50%;

    background:#d4a84f;

    color:#111;

    font-size:18px;

    font-weight:bold;
}


/* عنوان */

.service-card h2{

    margin:
        0 0 15px;

    color:#d4a84f;

    font-size:20px;

    line-height:1.8;
}


/* توضیحات */

.service-card p{

    margin:0;

    color:#ddd;

    font-size:15px;

    line-height:2.2;
}


/* ================= LAST CARD ================= */

.service-card:last-child{

    grid-column:
        1 / -1;

    max-width:540px;

    width:100%;

    justify-self:center;
}


/* ================= CONSULTATION ================= */

.consultation{

    text-align:center;

    margin-top:45px;

    padding:35px 20px;

    border:
        1px solid
        rgba(212,168,79,.25);

    border-radius:15px;

    background:
        rgba(212,168,79,.05);
}

.consultation h2{

    margin:
        0 0 12px;

    color:#fff;

    font-size:24px;
}

.consultation p{

    margin:
        0 auto 22px;

    color:#bbb;

    line-height:2;
}
