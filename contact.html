<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تماس با ما | بیکران گسترش تجارت پارسی</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        .header {
            height: 80px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid rgba(212,168,79,.12);

            background: #080808;
        }

        .logo {
            color: #d4a84f;
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            color: #d4a84f;
            border: 1px solid rgba(212,168,79,.4);
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .page {
            padding: 90px 0;
        }

        .title {
            text-align: center;
            margin-bottom: 60px;
        }

        .title span {
            color: #d4a84f;
            font-size: 14px;
        }

        .title h1 {
            margin-top: 15px;
            font-size: 40px;
        }

        .title p {
            color: #888;
            margin-top: 15px;
            line-height: 2;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .contact-card {
            background: #111;
            border: 1px solid rgba(212,168,79,.15);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
        }

        .icon {
            font-size: 30px;
            color: #d4a84f;
            margin-bottom: 20px;
        }

        .contact-card small {
            display: block;
            color: #777;
            margin-bottom: 10px;
        }

        .contact-card strong {
            color: #ddd;
            font-size: 14px;
            line-height: 2;
        }

        .contact-card a {
            color: #d4a84f;
        }

        @media(max-width:700px) {

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 32px;
            }

            .page {
                padding: 60px 0;
            }

        }

    </style>
</head>


<body>


<header class="header">

    <a
        href="/bikaran-website/"
        class="logo"
    >
        بیکران
    </a>

    <a
        href="/bikaran-website/"
        class="back"
    >
        ← بازگشت به خانه
    </a>

</header>



<main class="page">

    <div class="container">


        <div class="title">

            <span>
                در ارتباط باشیم
            </span>

            <h1>
                تماس با ما
            </h1>

            <p>
                برای ارتباط با بیکران گسترش تجارت پارسی
                از راه‌های زیر با ما در تماس باشید.
            </p>

        </div>



        <div class="contact-grid">


            <!-- تلفن -->

            <div class="contact-card">

                <div class="icon">
                    ☎
                </div>

                <small>
                    شماره تماس
                </small>

                <strong>
                    ۸۸۰۸۱۳۴۴۷
                </strong>

            </div>



            <!-- اینستاگرام -->

            <div class="contact-card">

                <div class="icon">
                    ◎
                </div>

                <small>
                    اینستاگرام
                </small>

                <strong>

                    <a
                        href="https://instagram.com/bikaran_trade"
                        target="_blank"
                    >
                        @bikaran_trade
                    </a>

                </strong>

            </div>



            <!-- آدرس -->

            <div class="contact-card">

                <div class="icon">
                    📍
                </div>

                <small>
                    آدرس
                </small>

                <strong>
                    تهران، شهرک غرب،
                    بلوار فرحزادی،
                    بعد از تقاطع دریا،
                    خیابان شهید اناری،
                    مجتمع اداری آریا،
                    طبقه ۴، واحد ۴۰۶
                </strong>

            </div>


        </div>

    </div>

</main>


</body>
</html>
