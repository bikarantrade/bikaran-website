<link rel="stylesheet" href="style.css">

<style>

.contact-page{

    min-height:100vh;

    padding:140px 20px 70px;

    background:#080808;

}

.contact-container{

    width:90%;

    max-width:1000px;

    margin:auto;

}

.contact-title{

    text-align:center;

    margin-bottom:50px;

}

.contact-title h1{

}

.contact-title p{

    color:#aaa;

    font-size:16px;

}

.contact-grid{

    grid-template-columns:repeat(3,1fr);

}

.contact-card{

    background:#111;

    border:1px solid rgba(212,168,79,.2);

    border-radius:15px;

    padding:35px 20px;

    text-align:center;

}

.contact-card h2{

    margin-bottom:15px;

}

.contact-card p{

    color:#ddd;

    line-height:2;

}

.contact-card a{

    color:#d4a84f;

}

.back-home{

    display:block;

    width:max-content;

    margin:45px auto 0;

    padding:14px 28px;

    background:#d4a84f;

    color:#111;

    border-radius:8px;

    font-weight:bold;

}

@media(max-width:700px){

    .contact-grid{

        grid-template-columns:1fr;

    }

    .contact-title h1{

        font-size:32px;

    }

}

</style>

</head>
