<!DOCTYPE html><html lang="fa" dir="rtl">

<head>

<title>بیکران گسترش تجارت پارسی</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:white;
font-family:Tahoma,Arial,sans-serif;
}

a{
text-decoration:none;
}

.header{
position:fixed;
top:0;
right:0;
left:0;
height:80px;
padding:0 25px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:1000;
}

.logo{
width:110px;
height:55px;
object-fit:contain;
}

.menu-button{
width:48px;
height:48px;
border:1px solid #d4a84f;
background:#111;
border-radius:8px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:6px;
cursor:pointer;
}

.menu-button span{
display:block;
width:24px;
height:2px;
background:#d4a84f;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:100px 20px 50px;
background:radial-gradient(circle,#29241b,#0d0d0d 50%,#050505);
}

.hero-content{
width:90%;
max-width:850px;
}

.company{
color:#d4a84f;
font-size:18px;
font-weight:bold;
margin-bottom:20px;
}

h1{
font-size:clamp(42px,7vw,78px);
line-height:1.5;
margin:0;
}

h1 span{
display:block;
color:#d4a84f;
}

.hero p{
max-width:700px;
margin:25px auto;
font-size:18px;
line-height:2.2;
color:#ddd;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:30px;
}

.button{
display:block;
min-width:190px;
padding:16px 25px;
border-radius:8px;
font-weight:bold;
}

.consult{
background:#d4a84f;
color:#111;
}

.services{
background:#111;
color:white;
border:1px solid #d4a84f;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
z-index:1998;
}

.overlay.active{
display:block;
}

.menu{
position:fixed;
top:0;
right:0;
width:320px;
max-width:85%;
height:100vh;
background:#111;
z-index:2000;
padding:25px;
transform:translateX(100%);
transition:.3s;
}

.menu.active{
transform:translateX(0);
}

.menu-top{
display:flex;
align-items:center;
justify-content:space-between;
padding-bottom:20px;
border-bottom:1px solid #333;
}

.menu-logo{
width:100px;
height:50px;
object-fit:contain;
}

.close{
background:none;
border:0;
color:#d4a84f;
font-size:35px;
cursor:pointer;
}

.menu a{
display:block;
color:white;
padding:17px 10px;
margin-top:5px;
border-radius:8px;
}

.menu a:hover{
color:#d4a84f;
background:#1c1c1c;
}

@media(max-width:600px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:15px;
}

.buttons{
flex-direction:column;
align-items:center;
}

.button{
width:100%;
max-width:280px;
}

}

</style>

</head>
