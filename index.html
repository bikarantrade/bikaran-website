<!DOCTYPE html><html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    right:0;
    left:0;

    height:80px;
    padding:0 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:1000;
}

.logo{
    width:120px;
    height:55px;
    object-fit:contain;
}


/* ================= MENU BUTTON ================= */

.menu-button{
    width:48px;
    height:48px;

    background:rgba(0,0,0,.65);

    border:1px solid #d4a84f;
    border-radius:8px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;

    cursor:pointer;
}

.menu-button span{
    width:23px;
    height:2px;

    background:#d4a84f;

    display:block;
}


/* ================= HOME ================= */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle at center,
            #24201a 0%,
            #0e0e0e 45%,
            #050505 100%
        );

    padding:100px 20px 50px;
}

.hero-content{
    width:90%;
    max-width:850px;

    text-align:center;

    position:relative;
    z-index:2;
}

.company{
    color:#d4a84f;

    font-size:18px;

    font-weight:bold;

    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(42px,7vw,78px);

    line-height:1.5;

    margin:0;
}

.hero h1 span{
    display:block;

    color:#d4a84f;
}

.hero p{
    max-width:700px;

    margin:25px auto 0;

    color:#ddd;

    font-size:18px;

    line-height:2.2;
}


/* ================= BUTTONS ================= */

.buttons{
    margin-top:35px;

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;
}

.button{
    display:inline-block;

    min-width:190px;

    padding:16px 28px;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    transition:.25s;

    text-align:center;
}

.button:hover{
    transform:translateY(-3px);
}

.consult{
    background:#d4a84f;

    color:#111;
}

.services{
    color:#fff;

    border:1px solid #d4a84f;

    background:rgba(0,0,0,.4);
}


/* ================= MENU OVERLAY ================= */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:1998;

    opacity:0;

    visibility:hidden;

    transition:.3s;
}

.overlay.active{
    opacity:1;

    visibility:visible;
}


/* ================= SIDE MENU ================= */

.menu{
    position:fixed;

    top:0;
    right:0;

    width:320px;

    max-width:85%;

    height:100vh;

    background:#111;

    border-left:1px solid rgba(212,168,79,.4);

    z-index:2000;

    padding:25px;

    transform:translateX(100%);

    transition:.3s;

    overflow-y:auto;
}

.menu.active{
    transform:translateX(0);
}


/* ================= MENU TOP ================= */

.menu-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-bottom:20px;

    border-bottom:1px solid #292929;
}

.menu-logo{
    width:105px;
    height:50px;

    object-fit:contain;
}

.close{
    background:none;

    border:0;

    color:#d4a84f;

    font-size:35px;

    cursor:pointer;

    line-height:1;
}


/* ================= MENU LINKS ================= */

.menu nav{
    margin-top:20px;
}

.menu a{
    display:block;

    color:#fff;

    padding:17px 15px;

    margin-top:5px;

    border-radius:8px;

    font-size:16px;

    transition:.2s;
}

.menu a:hover{
    color:#d4a84f;

    background:rgba(212,168,79,.1);
}


/* ================= MOBILE ================= */

@media(max-width:600px){
