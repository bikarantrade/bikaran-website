<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بیکران گسترش تجارت پارسی</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            z-index: 1000;

            background: rgba(8,8,8,.75);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(212,168,79,.08);
        }


        .logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-main {
            color: #d4a84f;
            font-size: 27px;
            font-weight: bold;
        }

        .logo-sub {
            color: #777;
            font-size: 9px;
            margin-top: 3px;
        }


        /* =========================
           MENU BUTTON
        ========================= */

        .menu-button {
            width: 48px;
            height: 48px;

            border: 1px solid rgba(212,168,79,.35);
            border-radius: 8px;

            background: rgba(212,168,79,.05);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 5px;

            cursor: pointer;
        }

        .menu-button span {
            width: 22px;
            height: 2px;

            background: #d4a84f;

            display: block;

            transition: .3s;
        }

        .menu-button:hover {
            background: rgba(212,168,79,.12);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;
            min-height: 100vh;

            position: relative;

            display: flex;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 75% 50%,
                    rgba(212,168,79,.13),
                    transparent 30%
                ),
                #080808;
        }


        .hero-content {
            width: 90%;
            max-width: 1200px;

            margin: 0 auto;

            padding-top: 80px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            align-items: center;

            gap: 70px;

            position: relative;
            z-index: 2;
        }


        /* =========================
           HERO TEXT
        ========================= */

        .hero-text {
            text-align: right;
        }

        .small-title {
            color: #d4a84f;

            font-size: 14px;

            margin-bottom: 20px;

            display: block;
        }

        .hero-title {
            font-size: clamp(40px, 5vw, 70px);

            line-height: 1.4;

            font-weight: bold;

            color: white;
        }

        .hero-title span {
            color: #d4a84f;

            display: block;
        }

        .hero-text p {
            color: #999;

            font-size: 16px;

            line-height: 2;

            margin-top: 25px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 15px;

            margin-top: 35px;

            flex-wrap: wrap;
        }

        .button {
            padding: 15px 25px;

            border-radius: 7px;

            font-size: 13px;

            transition: .3s;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 15px;
        }

        .button-primary {
            background: #d4a84f;
            color: #111;
        }

        .button-primary:hover {
            transform: translateY(-3px);
            background: #e4ba63;
        }

        .button-secondary {
            color: #d4a84f;

            border: 1px solid rgba(212,168,79,.5);
        }

        .button-secondary:hover {
            background: rgba(212,168,79,.1);

            transform: translateY(-3px);
        }


        /* =========================
           LOGO CIRCLE
        ========================= */

        .visual {
            height: 500px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(212,168,79,.18);
        }

        .circle.one {
            width: 450px;
            height: 450px;
        }

        .circle.two {
            width: 340px;
            height: 340px;

            border-color: rgba(212,168,79,.25);
        }

        .circle.three {
            width: 220px;
            height: 220px;

            border-color: rgba(212,168,79,.4);
        }


        .visual-logo {
            position: relative;

            z-index: 5;

            text-align: center;
        }

        .visual-logo strong {
            color: #d4a84f;

            font-size: 70px;

            display: block;
        }

        .visual-logo span {
            color: #777;

            font-size: 12px;
        }


        /* =========================
           DECORATION
        ========================= */

        .dot {
            position: absolute;

            width: 7px;
            height: 7px;

            background: #d4a84f;

            border-radius: 50%;

            box-shadow: 0 0 20px #d4a84f;
        }

        .dot-one {
            right: 20%;
            top: 18%;
        }

        .dot-two {
            left: 18%;
            bottom: 18%;
        }


        /* =========================
           SIDE MENU
        ========================= */

        .overlay {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.7);

            z-index: 1999;

            opacity: 0;

            visibility: hidden;

            transition: .3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }


        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            width: 330px;
            max-width: 85%;

            height: 100vh;

            background: #101010;

            border-left: 1px solid rgba(212,168,79,.2);

            z-index: 2000;

            transform: translateX(100%);

            transition: .35s;

            padding: 35px 28px;

            display: flex;

            flex-direction: column;
        }

        .side-menu.active {
            transform: translateX(0);
        }


        .menu-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding-bottom: 25px;

            border-bottom: 1px solid rgba(255,255,255,.08);
        }


        .menu-logo strong {
            color: #d4a84f;

            display: block;

            font-size: 25px;
        }

        .menu-logo span {
            color: #777;

            font-size: 9px;
        }


        .close-button {
            background: none;

            border: none;

            color: #d4a84f;

            font-size: 35px;

            cursor: pointer;
        }


        .menu-links {
            margin-top: 35px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .menu-links a {
            color: #ddd;

            padding: 18px;

            border-radius: 7px;

            font-size: 15px;

            transition: .3s;
        }

        .menu-links a:hover {
            background: rgba(212,168,79,.08);

            color: #d4a84f;

            padding-right: 25px;
        }


        .menu-footer {
            margin-top: auto;

            color: #555;

            font-size: 10px;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .top-header {
                height: 70px;

                padding: 0 20px;
            }

            .hero-content {
                width: 90%;

                grid-template-columns: 1fr;

                gap: 10px;

                padding-top: 100px;

                padding-bottom: 50px;
            }

            .hero {
                min-height: 100vh;
            }

            .hero-text {
                text-align: center;
            }

            .small-title {
                font-size: 12px;
            }

            .hero-title {
                font-size: 42px;
            }

            .hero-text p {
                font-size: 14px;
            }

            .buttons {
                justify-content: center;
            }

            .button {
                min-width: 160px;
            }

            .visual {
                height: 300px;
            }

            .circle.one {
                width: 270px;
                height: 270px;
            }

            .circle.two {
                width: 205px;
                height: 205px;
            }

            .circle.three {
                width: 135px;
                height: 135px;
            }

            .visual-logo strong {
                font-size: 50px;
            }

        }


        @media (max-width: 480px) {

            .hero-title {
                font-size: 35px;
            }

            .hero-text p {
                font-size: 13px;
            }

            .buttons {
                flex-direction: column;

                align-items: center;
            }

            .button {
                width: 100%;
                max-width: 300px;
            }

            .visual {
                height: 250px;
            }

            .logo-main {
                font-size: 23px;
            }

        }

    </style>
</head>


<body>


<!-- HEADER -->

<header class="top-header">

    <a href="index.html" class="logo">

        <span class="logo-main">
            بیکران
        </span>

        <span class="logo-sub">
            گسترش تجارت پارسی
        </span>

    </a>


    <button
        class="menu-button"
        id="openMenu"
        aria-label="منو"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>



<!-- HERO -->

<main>

<section class="hero">


    <div class="hero-content">


        <div class="hero-text">

            <span class="small-title">
                بیکران گسترش تجارت پارسی
            </span>


            <h1 class="hero-title">

                تجارت بین‌الملل،

                <span>
                    ساده‌تر از همیشه
                </span>

            </h1>


            <p>
                همراه شما در مسیر واردات،
                صادرات و خدمات بازرگانی
            </p>


            <div class="buttons">

                <a
                    href="contact.html"
                    class="button button-primary"
                >
                    درخواست مشاوره
                    <span>←</span>
                </a>


                <a
                    href="services.html"
                    class="button button-secondary"
                >
                    مشاهده خدمات
                    <span>←</span>
                </a>

            </div>

        </div>



        <div class="visual">

            <div class="circle one"></div>

            <div class="circle two"></div>

            <div class="circle three"></div>

            <div class="dot dot-one"></div>

            <div class="dot dot-two"></div>


            <div class="visual-logo">

                <strong>
                    بیکران
                </strong>

                <span>
                    گسترش تجارت پارسی
                </span>

            </div>

        </div>


    </div>


</section>

</main>



<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
></div>



<!-- SIDE MENU -->

<aside
    class="side-menu"
    id="sideMenu"
>


    <div class="menu-top">


        <div class="menu-logo">

            <strong>
                بیکران
            </strong>

            <span>
                گسترش تجارت پارسی
            </span>

        </div>


        <button
            class="close-button"
            id="closeMenu"
        >
            ×
        </button>

    </div>



    <nav class="menu-links">

        <a href="index.html">
            خانه
        </a>

        <a href="services.html">
            خدمات
        </a>

        <a href="about.html">
            درباره ما
        </a>

        <a href="news.html">
            اخبار
        </a>

        <a href="contact.html">
            تماس با ما
        </a>

    </nav>



    <div class="menu-footer">

        تجارت بین‌الملل، ساده‌تر از همیشه

    </div>


</aside>



<script>

    const openMenu =
        document.getElementById("openMenu");

    const closeMenu =
        document.getElementById("closeMenu");

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("overlay");


    openMenu.addEventListener("click", function () {

        sideMenu.classList.add("active");

        overlay.classList.add("active");

    });


    closeMenu.addEventListener("click", function () {

        sideMenu.classList.remove("active");

        overlay.classList.remove("active");

    });


    overlay.addEventListener("click", function () {

        sideMenu.classList.remove("active");

        overlay.classList.remove("active");

    });


</script>


</body>
</html>
