<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بیکران گسترش تجارت پارسی</title>


<!-- Estedad -->

<link
rel="stylesheet"
href="https://fonts.cdnfonts.com/css/estedad"
>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    width:100%;
    min-height:100vh;

    background:#080808;
    color:#fff;

    font-family:'Estedad',Tahoma,Arial,sans-serif;

    overflow-x:hidden;
}


a{
    text-decoration:none;
}


button,
input,
textarea,
select{
    font-family:'Estedad',Tahoma,Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

.header{

    position:fixed;

    top:0;
    right:0;
    left:0;

    height:80px;

    padding:0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:rgba(0,0,0,.35);

    backdrop-filter:blur(8px);

    border-bottom:
    1px solid rgba(255,255,255,.12);

    z-index:1000;
}


.header-logo{

    width:130px;
    height:55px;

    object-fit:contain;
}


/* =========================
   MENU BUTTON
========================= */

.menu-button{

    width:48px;
    height:48px;

    border:
    1px solid rgba(212,168,79,.7);

    border-radius:8px;

    background:rgba(0,0,0,.35);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:5px;

    cursor:pointer;
}


.menu-button span{

    width:22px;
    height:2px;

    background:#d4a84f;
}


/* =========================
   HERO
========================= */

.hero{

    min-height:100vh;

    width:100%;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:#080808;
}


/* BACKGROUND */

.hero-background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center;

    z-index:0;
}


/* DARK OVERLAY */

.hero-overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.82),
        rgba(0,0,0,.38),
        rgba(0,0,0,.72)
    );

    z-index:1;
}


/* =========================
   HERO CONTENT
========================= */

.hero-content{

    position:relative;

    z-index:2;

    width:90%;

    max-width:1100px;

    text-align:center;

    padding-top:80px;
}


/* نام شرکت */

.small-title{

    display:block;

    color:#d4a84f;

    font-size:17px;

    font-weight:700;

    margin-bottom:25px;

    letter-spacing:0;
}


/* تیتر اصلی */

.hero-title{

    font-size:
    clamp(48px,8vw,88px);

    line-height:1.45;

    font-weight:700;

    letter-spacing:-1px;

    text-shadow:
    0 5px 30px rgba(0,0,0,.85);
}


/* قسمت طلایی */

.hero-title span{

    display:block;

    color:#d4a84f;

    font-weight:700;
}


/* توضیحات */

.hero-description{

    max-width:700px;

    margin:28px auto 0;

    color:#f1f1f1;

    font-size:19px;

    font-weight:400;

    line-height:2.2;

    text-shadow:
    0 3px 15px #000;
}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    margin-top:38px;

    flex-wrap:wrap;
}


.button{

    padding:17px 32px;

    border-radius:9px;

    font-size:15px;

    font-weight:600;

    transition:.25s;
}


.primary{

    background:#d4a84f;

    color:#111;
}


.primary:hover{

    background:#e4ba63;

    transform:translateY(-3px);
}


.secondary{

    color:#fff;

    border:
    1px solid rgba(212,168,79,.8);

    background:
    rgba(0,0,0,.38);
}


.secondary:hover{

    background:
    rgba(212,168,79,.15);

    transform:translateY(-3px);
}


/* =========================
   OVERLAY
========================= */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.72);

    z-index:1999;

    opacity:0;

    visibility:hidden;

    transition:.3s;
}


.overlay.active{

    opacity:1;

    visibility:visible;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{

    position:fixed;

    top:0;

    right:0;

    width:330px;

    max-width:85%;

    height:100vh;

    background:#101010;

    border-left:
    1px solid rgba(212,168,79,.25);

    z-index:2000;

    transform:translateX(100%);

    transition:.35s;

    padding:30px;
}


.side-menu.active{

    transform:translateX(0);
}


/* MENU TOP */

.menu-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-bottom:25px;

    border-bottom:
    1px solid rgba(255,255,255,.1);
}


/* MENU LOGO */

.menu-logo{

    width:130px;
}


.menu-logo img{

    width:100%;

    height:55px;

    object-fit:contain;
}


/* CLOSE */

.close-button{

    border:0;

    background:none;

    color:#d4a84f;

    font-size:36px;

    cursor:pointer;

    font-family:Arial,sans-serif;
}


/* MENU LINKS */

.menu-links{

    display:flex;

    flex-direction:column;

    margin-top:25px;

    gap:5px;
}


.menu-links a{

    color:#eee;

    padding:17px;

    border-radius:8px;

    font-size:16px;

    font-weight:500;

    transition:.2s;
}


.menu-links a:hover{

    background:
    rgba(212,168,79,.1);

    color:#d4a84f;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{

        height:70px;

        padding:0 20px;
    }


    .header-logo{

        width:105px;

        height:48px;
    }


    .hero-overlay{

        background:
        rgba(0,0,0,.64);
    }


    .small-title{

        font-size:15px;

        margin-bottom:20px;
    }


    .hero-title{

        font-size:42px;

        line-height:1.5;

        letter-spacing:0;
    }


    .hero-description{

        font-size:16px;

        line-height:2;

        margin-top:22px;
    }


    .buttons{

        margin-top:30px;
    }


    .button{

        width:100%;

        max-width:280px;

        padding:15px 25px;

        font-size:14px;
    }

}


@media(max-width:400px){

    .hero-title{

        font-size:36px;
    }


    .hero-description{

        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


<a href="/bikaran-website/">

<img
class="header-logo"
src="/bikaran-website/logo.png.jpeg"
alt="بیکران گسترش تجارت پارسی"
>

</a>


<button
class="menu-button"
id="openMenu"
aria-label="باز کردن منو"
>

<span></span>
<span></span>
<span></span>

</button>


</header>



<!-- =========================
     HERO
========================= -->

<main>

<section class="hero">


<img
class="hero-background"
src="/bikaran-website/logo.png.jpeg"
alt=""
>


<div class="hero-overlay"></div>


<div class="hero-content">


<span class="small-title">

بیکران گسترش تجارت پارسی

</span>


<h1 class="hero-title">

تجارت بین‌الملل،

<span>
ساده‌تر از همیشه
</span>

</h1>


<p class="hero-description">

همراه شما در مسیر واردات،
صادرات و خدمات بازرگانی

</p>


<div class="buttons">


<a
href="consultation.html"
class="button primary"
>

درخواست مشاوره

</a>


<a
href="services.html"
class="button secondary"
>

مشاهده خدمات

</a>


</div>


</div>


</section>

</main>



<!-- =========================
     OVERLAY
========================= -->

<div
class="overlay"
id="overlay"
></div>



<!-- =========================
     SIDE MENU
========================= -->

<aside
class="side-menu"
id="sideMenu"
>


<div class="menu-top">


<div class="menu-logo">

<img
src="/bikaran-website/logo.png.jpeg"
alt="بیکران"
>

</div>


<button
class="close-button"
id="closeMenu"
>

×

</button>


</div>



<nav class="menu-links">


<a href="/bikaran-website/">
خانه
</a>


<a href="services.html">
خدمات
</a>


<a href="about.html">
درباره ما
</a>


<a href="news.html">
اخبار
</a>


<a href="contact.html">
تماس با ما
</a>


</nav>


</aside>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const openMenu =
document.getElementById("openMenu");

const closeMenu =
document.getElementById("closeMenu");

const sideMenu =
document.getElementById("sideMenu");

const overlay =
document.getElementById("overlay");


openMenu.onclick=function(){

    sideMenu.classList.add("active");

    overlay.classList.add("active");

};


closeMenu.onclick=function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


overlay.onclick=function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};

</script>


</body>

</html>
