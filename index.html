<head>

<title>بیکران گسترش تجارت پارسی</title>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Tahoma, Arial, sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* =========================
   HEADER
========================= */

.header{
    position:fixed;

    top:0;
    right:0;
    left:0;

    width:100%;
    height:80px;

    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:1000;

    background:rgba(0,0,0,.20);
}


/* LOGO */

.logo{
    width:125px;
    height:55px;

    object-fit:contain;
}


/* =========================
   THREE LINE MENU
========================= */

.menu-button{

    width:50px;
    height:50px;

    border:1px solid #d4a84f;

    border-radius:8px;

    background:rgba(0,0,0,.55);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:6px;

    cursor:pointer;

    position:relative;

    z-index:2001;
}

.menu-button span{

    display:block;

    width:24px;

    height:2px;

    background:#d4a84f;

    transition:.3s;
}


/* =========================
   HERO
========================= */

.hero{

    position:relative;

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


/* BACKGROUND */

.hero-image{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:center;

    z-index:0;
}


/* DARK OVERLAY */

.hero-overlay{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.70),
            rgba(0,0,0,.62)
        );

    z-index:1;
}


/* =========================
   HERO CONTENT
========================= */

.hero-content{

    position:relative;

    z-index:2;

    width:90%;

    max-width:950px;

    text-align:center;

    padding-top:70px;
}


.company-name{

    display:block;

    color:#d4a84f;

    font-size:18px;

    font-weight:bold;

    margin-bottom:22px;
}


.hero-content h1{

    font-size:clamp(42px,7vw,78px);

    line-height:1.5;

    font-weight:700;

    margin:0;
}

.hero-content h1 span{

    display:block;

    color:#d4a84f;
}


.hero-content p{

    max-width:720px;

    margin:25px auto 0;

    color:#eee;

    font-size:18px;

    line-height:2.2;
}


/* =========================
   HOME BUTTONS
========================= */

.home-buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    margin-top:35px;

    flex-wrap:wrap;
}


.home-button{

    display:flex;

    align-items:center;

    justify-content:center;

    min-width:190px;

    padding:16px 28px;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    transition:.25s;

    cursor:pointer;
}


.consultation{

    background:#d4a84f;

    color:#111;
}


.services{

    background:rgba(0,0,0,.45);

    color:#fff;

    border:1px solid #d4a84f;
}


.home-button:hover{

    transform:translateY(-3px);
}


/* =========================
   DARK OVERLAY FOR MENU
========================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:1998;

    opacity:0;

    visibility:hidden;

    transition:.3s;
}


.menu-overlay.active{

    opacity:1;

    visibility:visible;
}
