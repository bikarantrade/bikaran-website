<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    right:0;
    left:0;

    height:80px;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:9999;
}


/* ================= LOGO ================= */

.logo{
    width:75px;
    height:60px;

    object-fit:contain;
    display:block;
}


/* ================= MENU BUTTON ================= */

.menu-button{
    width:48px;
    height:48px;

    padding:0;

    background:rgba(0,0,0,.75);

    border:1px solid #d4a84f;
    border-radius:8px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;

    cursor:pointer;
}

.menu-button span{
    display:block;

    width:23px;
    height:2px;

    background:#d4a84f;
}


/* ================= HERO ================= */

.hero{
    min-height:100vh;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:100px 20px 50px;

    background-image:
        linear-gradient(
            rgba(0,0,0,.58),
            rgba(0,0,0,.72)
        ),
        url("https://raw.githubusercontent.com/bikarantrade/bikaran-website/main/logo.png.jpeg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}


/* ================= HERO CONTENT ================= */

.hero-content{
    width:90%;
    max-width:900px;

    position:relative;
    z-index:2;
}


/* ================= COMPANY ================= */

.company{
    color:#d4a84f;

    font-size:19px;

    font-weight:bold;

    margin-bottom:22px;

    text-shadow:
        0 2px 10px #000;
}


/* ================= TITLE ================= */

h1{
    margin:0;

    font-size:
        clamp(42px,7vw,78px);

    line-height:1.5;

    font-weight:700;

    text-shadow:
        0 5px 25px #000;
}

h1 span{
    display:block;

    color:#d4a84f;
}


/* ================= DESCRIPTION ================= */

.hero p{
    max-width:720px;

    margin:25px auto;

    color:#f1f1f1;

    font-size:18px;

    line-height:2.2;

    text-shadow:
        0 3px 15px #000;
}


/* ================= BUTTONS ================= */

.buttons{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin-top:32px;
}

.button{
    display:block;

    min-width:190px;

    padding:16px 27px;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    text-align:center;

    transition:.25s;
}

.button:hover{
    transform:translateY(-3px);
}

.consult{
    background:#d4a84f;

    color:#111;
}

.services{
    background:rgba(0,0,0,.65);

    color:#fff;

    border:1px solid #d4a84f;
}


/* ================= OVERLAY ================= */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:10000;

    display:none;
}

.overlay.active{
    display:block;
}


/* ================= MENU ================= */

.menu{
    position:fixed;

    top:0;
    right:0;

    width:320px;

    max-width:85%;

    height:100vh;

    background:#111;

    z-index:10001;

    padding:25px;

    transform:translateX(100%);

    transition:transform .3s ease;

    overflow-y:auto;
}

.menu.active{
    transform:translateX(0);
}


/* ================= MENU TOP ================= */

.menu-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-bottom:20px;

    border-bottom:1px solid #333;
}


/* ================= MENU LOGO ================= */

.menu-logo{
    width:90px;

    height:60px;

    object-fit:contain;

    display:block;
}


/* ================= CLOSE ================= */

.close{
    background:none;

    border:0;

    color:#d4a84f;

    font-size:35px;

    cursor:pointer;

    padding:0 8px;
}


/* ================= MENU LINKS ================= */

.menu nav{
    margin-top:15px;
}

.menu nav a{
    display:block;

    color:#fff;

    padding:17px 10px;

    margin-top:5px;

    border-radius:8px;

    font-size:16px;

    transition:.2s;
}

.menu nav a:hover{
    color:#d4a84f;

    background:#1c1c1c;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        padding:0 18px;
    }

    .logo{
        width:65px;
        height:55px;
    }

    .hero{
        padding:
            100px
            18px
            50px;

        background-position:center;
    }

    .hero h1{
        font-size:40px;
    }

    .hero p{
        font-size:15px;
        line-height:2;
    }

    .buttons{
        flex-direction:column;
        align-items:center;
    }

    .button{
        width:100%;
        max-width:280px;
    }

    .menu{
        width:290px;
    }

}


/* ================= SMALL MOBILE ================= */

@media(max-width:380px){

    .hero h1{
        font-size:34px;
    }

    .company{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">


<a
href="https://bikarantrade.github.io/bikaran-website/"
>

<img
src="https://raw.githubusercontent.com/bikarantrade/bikaran-website/main/logo.png.jpeg"
class="logo"
alt="بیکران گسترش تجارت پارسی"
>

</a>


<button
type="button"
class="menu-button"
onclick="openMenu()"
aria-label="باز کردن منو"
>

<span></span>
<span></span>
<span></span>

</button>


</header>



<!-- ================= HERO ================= -->

<section class="hero">


<div class="hero-content">


<div class="company">

بیکران گسترش تجارت پارسی

</div>


<h1>

تجارت بین‌الملل

<span>
ساده‌تر از همیشه
</span>

</h1>


<p>

همراه شما در مسیر واردات، صادرات،
مشاوره و آموزش امور تخصصی بازرگانی خارجی

</p>


<div class="buttons">


<a
href="https://bikarantrade.github.io/bikaran-website/consultation.html"
class="button consult"
>

درخواست مشاوره

</a>


<a
href="https://bikarantrade.github.io/bikaran-website/services.html"
class="button services"
>

مشاهده خدمات

</a>


</div>


</div>

</section>



<!-- ================= OVERLAY ================= -->

<div
class="overlay"
id="overlay"
onclick="closeMenu()"
></div>



<!-- ================= MENU ================= -->

<aside
class="menu"
id="menu"
>


<div class="menu-top">


<img
src="https://raw.githubusercontent.com/bikarantrade/bikaran-website/main/logo.png.jpeg"
class="menu-logo"
alt="بیکران گسترش تجارت پارسی"
>


<button
type="button"
class="close"
onclick="closeMenu()"
>

×

</button>


</div>


<nav>


<a href="https://bikarantrade.github.io/bikaran-website/">
خانه
</a>


<a href="https://bikarantrade.github.io/bikaran-website/services.html">
خدمات
</a>


<a href="https://bikarantrade.github.io/bikaran-website/about.html">
درباره ما
</a>


<a href="https://bikarantrade.github.io/bikaran-website/news.html">
اخبار
</a>


<a href="https://bikarantrade.github.io/bikaran-website/consultation.html">
مشاوره
</a>


<a href="https://bikarantrade.github.io/bikaran-website/contact.html">
تماس با ما
</a>


</nav>


</aside>



<!-- ================= JAVASCRIPT ================= -->

<script>

function openMenu(){

    document
    .getElementById("menu")
    .classList
    .add("active");

    document
    .getElementById("overlay")
    .classList
    .add("active");

}


function closeMenu(){

    document
    .getElementById("menu")
    .classList
    .remove("active");

    document
    .getElementById("overlay")
    .classList
    .remove("active");

}

</script>


</body>

</html>
