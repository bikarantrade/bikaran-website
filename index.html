<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بیکران گسترش تجارت پارسی</title>

    <meta
        name="description"
        content="بیکران گسترش تجارت پارسی | تجارت بین‌الملل، واردات، صادرات و خدمات بازرگانی"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        .top-header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;

            width: 100%;
            height: 80px;

            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(8, 8, 8, 0.82);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(212, 168, 79, 0.08);

            z-index: 1000;
        }


        /* LOGO */

        .logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;

            cursor: pointer;
        }

        .logo-main {
            color: #d4a84f;

            font-size: 27px;

            font-weight: bold;

            line-height: 1;
        }

        .logo-sub {
            color: #777;

            font-size: 9px;

            margin-top: 5px;
        }


        /* =========================
           MENU BUTTON
        ========================= */

        .menu-button {
            width: 48px;
            height: 48px;

            border: 1px solid rgba(212, 168, 79, 0.4);

            border-radius: 8px;

            background: rgba(212, 168, 79, 0.05);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 5px;

            cursor: pointer;
        }

        .menu-button span {
            display: block;

            width: 22px;
            height: 2px;

            background: #d4a84f;

            transition: 0.3s;
        }

        .menu-button:hover {
            background: rgba(212, 168, 79, 0.12);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 75% 50%,
                    rgba(212, 168, 79, 0.14),
                    transparent 30%
                ),
                #080808;
        }


        .hero::before {
            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            right: -350px;
            top: 50%;

            transform: translateY(-50%);

            border: 1px solid rgba(212, 168, 79, 0.08);

            border-radius: 50%;
        }


        .hero-content {
            width: 90%;
            max-width: 1200px;

            margin: 0 auto;

            padding-top: 80px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            align-items: center;

            gap: 70px;

            position: relative;

            z-index: 2;
        }


        /* =========================
           TEXT
        ========================= */

        .hero-text {
            text-align: right;
        }

        .small-title {
            display: block;

            color: #d4a84f;

            font-size: 14px;

            margin-bottom: 20px;
        }


        .hero-title {
            color: #ffffff;

            font-size: clamp(42px, 5vw, 70px);

            line-height: 1.4;

            font-weight: bold;
        }

        .hero-title span {
            display: block;

            color: #d4a84f;
        }


        .hero-description {
            color: #999;

            font-size: 16px;

            line-height: 2;

            margin-top: 25px;

            max-width: 550px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 35px;

            flex-wrap: wrap;
        }


        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            min-width: 175px;

            padding: 15px 24px;

            border-radius: 7px;

            font-size: 13px;

            transition: 0.3s;
        }


        .button-primary {
            background: #d4a84f;

            color: #111;

            border: 1px solid #d4a84f;
        }

        .button-primary:hover {
            background: #e4ba63;

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(212, 168, 79, 0.15);
        }


        .button-secondary {
            color: #d4a84f;

            background: rgba(212, 168, 79, 0.03);

            border: 1px solid rgba(212, 168, 79, 0.5);
        }

        .button-secondary:hover {
            background: rgba(212, 168, 79, 0.1);

            transform: translateY(-3px);
        }


        /* =========================
           VISUAL
        ========================= */

        .visual {
            width: 100%;

            height: 500px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(212, 168, 79, 0.2);
        }


        .circle-one {
            width: 450px;
            height: 450px;
        }


        .circle-two {
            width: 340px;
            height: 340px;

            border-color: rgba(212, 168, 79, 0.28);
        }


        .circle-three {
            width: 220px;
            height: 220px;

            border-color: rgba(212, 168, 79, 0.45);
        }


        .visual-logo {
            position: relative;

            z-index: 5;

            text-align: center;
        }


        .visual-logo strong {
            display: block;

            color: #d4a84f;

            font-size: 70px;

            font-weight: bold;
        }


        .visual-logo span {
            color: #777;

            font-size: 12px;
        }


        /* =========================
           DOTS
        ========================= */

        .dot {
            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #d4a84f;

            box-shadow:
                0 0 20px rgba(212, 168, 79, 0.8);
        }


        .dot-one {
            right: 18%;

            top: 18%;
        }


        .dot-two {
            left: 18%;

            bottom: 18%;
        }


        /* =========================
           SIDE MENU
        ========================= */

        .overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.7);

            z-index: 1999;

            opacity: 0;

            visibility: hidden;

            transition: 0.3s;
        }


        .overlay.active {
            opacity: 1;

            visibility: visible;
        }


        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            width: 330px;

            max-width: 85%;

            height: 100vh;

            background: #101010;

            border-left: 1px solid rgba(212, 168, 79, 0.2);

            z-index: 2000;

            transform: translateX(100%);

            transition: transform 0.35s ease;

            padding: 35px 28px;

            display: flex;

            flex-direction: column;
        }


        .side-menu.active {
            transform: translateX(0);
        }


        .menu-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding-bottom: 25px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }


        .menu-logo strong {
            display: block;

            color: #d4a84f;

            font-size: 25px;
        }


        .menu-logo span {
            color: #777;

            font-size: 9px;
        }


        .close-button {
            border: none;

            background: none;

            color: #d4a84f;

            font-size: 35px;

            line-height: 1;

            cursor: pointer;
        }


        .menu-links {
            display: flex;

            flex-direction: column;

            gap: 7px;

            margin-top: 30px;
        }


        .menu-links a {
            display: block;

            color: #ddd;

            padding: 17px;

            border-radius: 7px;

            font-size: 15px;

            transition: 0.3s;
        }


        .menu-links a:hover {
            color: #d4a84f;

            background: rgba(212, 168, 79, 0.08);

            padding-right: 25px;
        }


        .menu-footer {
            margin-top: auto;

            text-align: center;

            color: #555;

            font-size: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .top-header {
                height: 70px;

                padding: 0 20px;
            }


            .hero-content {
                width: 90%;

                grid-template-columns: 1fr;

                gap: 0;

                padding-top: 100px;

                padding-bottom: 40px;
            }


            .hero-text {
                text-align: center;
            }


            .small-title {
                font-size: 12px;
            }


            .hero-title {
                font-size: 42px;
            }


            .hero-description {
                font-size: 14px;

                margin-left: auto;
                margin-right: auto;
            }


            .buttons {
                justify-content: center;
            }


            .button {
                min-width: 160px;
            }


            .visual {
                height: 300px;
            }


            .circle-one {
                width: 270px;
                height: 270px;
            }


            .circle-two {
                width: 205px;
                height: 205px;
            }


            .circle-three {
                width: 135px;
                height: 135px;
            }


            .visual-logo strong {
                font-size: 50px;
            }

        }


        @media (max-width: 480px) {

            .hero-title {
                font-size: 35px;
            }


            .hero-description {
                font-size: 13px;
            }


            .buttons {
                flex-direction: column;

                align-items: center;
            }


            .button {
                width: 100%;

                max-width: 300px;
            }


            .visual {
                height: 250px;
            }


            .visual-logo strong {
                font-size: 43px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top-header">


    <!-- لینک مستقیم به صفحه اصلی GitHub Pages -->

    <a
        href="/bikaran-website/"
        class="logo"
    >

        <span class="logo-main">
            بیکران
        </span>

        <span class="logo-sub">
            گسترش تجارت پارسی
        </span>

    </a>


    <button
        class="menu-button"
        id="openMenu"
        type="button"
        aria-label="باز کردن منو"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


</header>



<!-- =========================
     HERO
========================= -->

<main>

<section class="hero">


    <div class="hero-content">


        <div class="hero-text">


            <span class="small-title">
                بیکران گسترش تجارت پارسی
            </span>


            <h1 class="hero-title">

                تجارت بین‌الملل،

                <span>
                    ساده‌تر از همیشه
                </span>

            </h1>


            <p class="hero-description">

                همراه شما در مسیر واردات،
                صادرات و خدمات بازرگانی

            </p>


            <div class="buttons">


                <a
                    href="contact.html"
                    class="button button-primary"
                >

                    درخواست مشاوره

                    <span>
                        ←
                    </span>

                </a>


                <a
                    href="services.html"
                    class="button button-secondary"
                >

                    مشاهده خدمات

                    <span>
                        ←
                    </span>

                </a>


            </div>


        </div>



        <!-- بخش گرافیکی -->

        <div class="visual">


            <div class="circle circle-one"></div>

            <div class="circle circle-two"></div>

            <div class="circle circle-three"></div>


            <div class="dot dot-one"></div>

            <div class="dot dot-two"></div>


            <div class="visual-logo">

                <strong>
                    بیکران
                </strong>

                <span>
                    گسترش تجارت پارسی
                </span>

            </div>


        </div>


    </div>


</section>

</main>



<!-- =========================
     OVERLAY
========================= -->

<div
    class="overlay"
    id="overlay"
></div>



<!-- =========================
     SIDE MENU
========================= -->

<aside
    class="side-menu"
    id="sideMenu"
>


    <div class="menu-top">


        <div class="menu-logo">

            <strong>
                بیکران
            </strong>

            <span>
                گسترش تجارت پارسی
            </span>

        </div>


        <button
            class="close-button"
            id="closeMenu"
            type="button"
        >

            ×

        </button>


    </div>



    <nav class="menu-links">


        <!-- خانه -->

        <a href="/bikaran-website/">
            خانه
        </a>


        <!-- خدمات -->

        <a href="services.html">
            خدمات
        </a>


        <!-- درباره -->

        <a href="about.html">
            درباره ما
        </a>


        <!-- اخبار -->

        <a href="news.html">
            اخبار
        </a>


        <!-- تماس -->

        <a href="contact.html">
            تماس با ما
        </a>


    </nav>



    <div class="menu-footer">

        تجارت بین‌الملل، ساده‌تر از همیشه

    </div>


</aside>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    const openMenu =
        document.getElementById("openMenu");

    const closeMenu =
        document.getElementById("closeMenu");

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("overlay");


    openMenu.addEventListener(
        "click",
        function () {

            sideMenu.classList.add("active");

            overlay.classList.add("active");

        }
    );


    closeMenu.addEventListener(
        "click",
        function () {

            sideMenu.classList.remove("active");

            overlay.classList.remove("active");

        }
    );


    overlay.addEventListener(
        "click",
        function () {

            sideMenu.classList.remove("active");

            overlay.classList.remove("active");

        }
    );


</script>


</body>

</html>
