<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بیکران گسترش تجارت پارسی</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}

.top-header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:80px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(8,8,8,.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,168,79,.1);
    z-index:1000;
}

.logo{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.logo-main{
    color:#d4a84f;
    font-size:27px;
    font-weight:bold;
}

.logo-sub{
    color:#777;
    font-size:9px;
    margin-top:4px;
}

.menu-button{
    width:48px;
    height:48px;
    border:1px solid rgba(212,168,79,.4);
    border-radius:8px;
    background:rgba(212,168,79,.05);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
}

.menu-button span{
    width:22px;
    height:2px;
    background:#d4a84f;
}

.hero{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    background:
    radial-gradient(circle at 75% 50%,rgba(212,168,79,.14),transparent 30%),
    #080808;
}

.hero-content{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding-top:80px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.hero-text{
    text-align:right;
}

.small-title{
    display:block;
    color:#d4a84f;
    font-size:14px;
    margin-bottom:20px;
}

.hero-title{
    font-size:clamp(42px,5vw,70px);
    line-height:1.4;
}

.hero-title span{
    display:block;
    color:#d4a84f;
}

.hero-description{
    color:#999;
    line-height:2;
    margin-top:25px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:35px;
    flex-wrap:wrap;
}

.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    padding:15px 25px;
    border-radius:7px;
    font-size:13px;
}

.button-primary{
    background:#d4a84f;
    color:#111;
}

.button-secondary{
    color:#d4a84f;
    border:1px solid rgba(212,168,79,.5);
}

.visual{
    height:500px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.circle{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(212,168,79,.2);
}

.circle-one{
    width:450px;
    height:450px;
}

.circle-two{
    width:340px;
    height:340px;
}

.circle-three{
    width:220px;
    height:220px;
}

.visual-logo{
    text-align:center;
    position:relative;
    z-index:2;
}

.visual-logo strong{
    display:block;
    color:#d4a84f;
    font-size:70px;
}

.visual-logo span{
    color:#777;
    font-size:12px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:1999;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.side-menu{
    position:fixed;
    top:0;
    right:0;
    width:330px;
    max-width:85%;
    height:100vh;
    background:#101010;
    border-left:1px solid rgba(212,168,79,.2);
    z-index:2000;
    transform:translateX(100%);
    transition:.35s;
    padding:35px 28px;
}

.side-menu.active{
    transform:translateX(0);
}

.menu-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:25px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.menu-logo strong{
    display:block;
    color:#d4a84f;
    font-size:25px;
}

.menu-logo span{
    color:#777;
    font-size:9px;
}

.close-button{
    border:0;
    background:none;
    color:#d4a84f;
    font-size:35px;
    cursor:pointer;
}

.menu-links{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:30px;
}

.menu-links a{
    color:#ddd;
    padding:17px;
    border-radius:7px;
    font-size:15px;
}

.menu-links a:hover{
    color:#d4a84f;
    background:rgba(212,168,79,.08);
}

@media(max-width:800px){

    .hero-content{
        grid-template-columns:1fr;
        text-align:center;
        gap:0;
    }

    .hero-text{
        text-align:center;
    }

    .hero-title{
        font-size:42px;
    }

    .buttons{
        justify-content:center;
    }

    .visual{
        height:300px;
    }

    .circle-one{
        width:270px;
        height:270px;
    }

    .circle-two{
        width:205px;
        height:205px;
    }

    .circle-three{
        width:135px;
        height:135px;
    }

    .visual-logo strong{
        font-size:50px;
    }
}
</style>
</head>

<body>

<header class="top-header">

<a href="/bikaran-website/" class="logo">
<span class="logo-main">بیکران</span>
<span class="logo-sub">گسترش تجارت پارسی</span>
</a>

<button class="menu-button" id="openMenu">
<span></span>
<span></span>
<span></span>
</button>

</header>

<main>

<section class="hero">

<div class="hero-content">

<div class="hero-text">

<span class="small-title">
بیکران گسترش تجارت پارسی
</span>

<h1 class="hero-title">
تجارت بین‌الملل،
<span>ساده‌تر از همیشه</span>
</h1>

<p class="hero-description">
همراه شما در مسیر واردات، صادرات و خدمات بازرگانی
</p>

<div class="buttons">

<a href="consultation.html" class="button button-primary">
درخواست مشاوره ←
</a>

<a href="services.html" class="button button-secondary">
مشاهده خدمات ←
</a>

</div>

</div>

<div class="visual">

<div class="circle circle-one"></div>
<div class="circle circle-two"></div>
<div class="circle circle-three"></div>

<div class="visual-logo">
<strong>بیکران</strong>
<span>گسترش تجارت پارسی</span>
</div>

</div>

</div>

</section>

</main>

<div class="overlay" id="overlay"></div>

<aside class="side-menu" id="sideMenu">

<div class="menu-top">

<div class="menu-logo">
<strong>بیکران</strong>
<span>گسترش تجارت پارسی</span>
</div>

<button class="close-button" id="closeMenu">×</button>

</div>

<nav class="menu-links">

<a href="/bikaran-website/">
خانه
</a>

<a href="services.html">
خدمات
</a>

<a href="about.html">
درباره ما
</a>

<a href="news.html">
اخبار
</a>

<a href="contact.html">
تماس با ما
</a>

</nav>

</aside>

<script>

const openMenu=document.getElementById("openMenu");
const closeMenu=document.getElementById("closeMenu");
const sideMenu=document.getElementById("sideMenu");
const overlay=document.getElementById("overlay");

openMenu.onclick=function(){
sideMenu.classList.add("active");
overlay.classList.add("active");
};

closeMenu.onclick=function(){
sideMenu.classList.remove("active");
overlay.classList.remove("active");
};

overlay.onclick=function(){
sideMenu.classList.remove("active");
overlay.classList.remove("active");
};

</script>

</body>
</html>
