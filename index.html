<!DOCTYPE html><html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بیکران گسترش تجارت پارسی</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.home{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.home-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
}

.home-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.62);
    z-index:1;
}

.header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:80px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:100;
}

.logo{
    width:120px;
    height:55px;
    object-fit:contain;
}

.menu-button{
    width:48px;
    height:48px;
    border:1px solid #d4a84f;
    border-radius:8px;
    background:rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
}

.menu-button span{
    width:23px;
    height:2px;
    background:#d4a84f;
}

.home-content{
    position:relative;
    z-index:2;
    width:90%;
    max-width:900px;
    text-align:center;
}

.small-title{
    color:#d4a84f;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

.home-content h1{
    font-size:clamp(42px,7vw,78px);
    line-height:1.5;
    margin:0;
}

.home-content h1 span{
    color:#d4a84f;
}

.home-content p{
    color:#eee;
    font-size:18px;
    line-height:2.2;
    max-width:700px;
    margin:25px auto;
}

.home-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.home-button{
    display:inline-block;
    padding:15px 30px;
    border-radius:8px;
    font-weight:bold;
    transition:.25s;
}

.gold{
    background:#d4a84f;
    color:#111;
}

.dark{
    border:1px solid #d4a84f;
    color:#fff;
    background:rgba(0,0,0,.4);
}

.home-button:hover{
    transform:translateY(-3px);
}

.side-menu{
    position:fixed;
    top:0;
    right:0;
    width:330px;
    max-width:85%;
    height:100vh;
    background:#101010;
    z-index:1000;
    padding:30px;
    transform:translateX(100%);
    transition:.3s;
    border-left:1px solid rgba(212,168,79,.3);
}

.side-menu.active{
    transform:translateX(0);
}

.close{
    color:#d4a84f;
    font-size:35px;
    border:0;
    background:none;
    cursor:pointer;
}

.side-menu nav{
    margin-top:30px;
}

.side-menu nav a{
    display:block;
    color:#fff;
    padding:17px;
    border-radius:8px;
    font-size:16px;
    margin-bottom:5px;
}

.side-menu nav a:hover{
    color:#d4a84f;
    background:rgba(212,168,79,.1);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:999;
    display:none;
}

.overlay.active{
    display:block;
}

@media(max-width:600px){

    .header{
        height:70px;
        padding:0 20px;
    }

    .home-content h1{
        font-size:40px;
    }

    .home-content p{
        font-size:15px;
    }

    .home-button{
        width:100%;
        max-width:280px;
    }

}

</style>

</head>

<body>


<header class="header">

<a href="https://bikarantrade.github.io/bikaran-website/">
<img src="logo.png.jpeg" class="logo" alt="بیکران">
</a>

<button class="menu-button" onclick="openMenu()">
<span></span>
<span></span>
<span></span>
</button>

</header>


<section class="home">

<img
src="logo.png.jpeg"
class="home-bg"
alt=""
>

<div class="home-overlay"></div>


<div class="home-content">

<div class="small-title">
بیکران گسترش تجارت پارسی
</div>

<h1>
همراه شما در
<span>تجارت بین‌الملل</span>
</h1>

<p>
ارائه خدمات تخصصی بازرگانی،
مشاوره و آموزش امور تخصصی بازرگانی خارجی
برای توسعه کسب‌وکار شما.
</p>


<div class="home-buttons">

<a
href="consultation.html"
class="home-button gold"
>
درخواست مشاوره
</a
