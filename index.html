<!DOCTYPE html><html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بیکران گسترش تجارت پارسی</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* HEADER */

.header{
    position:fixed;
    top:0;
    right:0;
    left:0;

    height:80px;

    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:9999;
}


/* LOGO */

.logo{
    width:120px;
    height:55px;

    object-fit:contain;
}


/* MENU BUTTON */

.menu-button{
    width:48px;
    height:48px;

    background:#111;

    border:1px solid #d4a84f;

    border-radius:8px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:6px;

    cursor:pointer;

    padding:0;
}

.menu-button span{
    display:block;

    width:23px;
    height:2px;

    background:#d4a84f;
}


/* HERO */

.hero{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:100px 20px 50px;

    background:
    radial-gradient(
        circle,
        #29241c 0%,
        #0d0d0d 50%,
        #050505 100%
    );
}

.hero-content{
    width:90%;
    max-width:850px;
}

.company{
    color:#d4a84f;

    font-size:18px;

    font-weight:bold;

    margin-bottom:20px;
}

h1{
    font-size:clamp(42px,7vw,78px);

    line-height:1.5;

    margin:0;
}

h1 span{
    display:block;

    color:#d4a84f;
}

.hero p{
    max-width:700px;

    margin:25px auto;

    color:#ddd;

    font-size:18px;

    line-height:2.2;
}


/* BUTTONS */

.buttons{
    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin-top:30px;
}

.button{
    display:block;

    min-width:190px;

    padding:16px 25px;

    border-radius:8px;

    font-weight:bold;

    text-align:center;
}

.consult{
    background:#d4a84f;

    color:#111;
}

.services{
    background:#111;

    color:#fff;

    border:1px solid #d4a84f;
}


/* OVERLAY */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:10000;

    display:none;
}

.overlay.active{
    display:block;
}


/* MENU */

.menu{
    position:fixed;

    top:0;
    right:0;

    width:320px;

    max-width:85%;

    height:100vh;

    background:#111;

    z-index:10001;

    padding:25px;

    transform:translateX(100%);

    transition:transform .3s ease;

    overflow-y:auto;
}

.menu.active{
    transform:translateX(0);
}


/* MENU TOP */

.menu-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding-bottom:20px;

    border-bottom:1px solid #333;
}

.menu-logo{
    width:100px;

    height:50px;

    object-fit:contain;
}

.close{
    background:none;

    border:0;

    color:#d4a84f;

    font-size:35px;

    cursor:pointer;

    padding:0 8px;
}


/* MENU LINKS */

.menu nav{
    margin-top:15px;
}

.menu nav a{
    display:block;

    color:#fff;

    padding:17px 10px;

    margin-top:5px;

    border-radius:8px;

    font-size:16px;
}

.menu nav a:hover{
    color:#d4a84f;

    background:#1c1c1c;
}


/* MOBILE */

@media(max-width:600px){

    .header{
        padding:0 18px;
    }

    .hero h1{
        font-size:40px;
    }

    .hero p{
        font-size:15px;
    }

    .buttons{
        flex-direction:column;

        align-items:center;
    }

    .button{
        width:100%;

        max-width:280px;
    }

    .menu{
        width:290px;
    }

}

</style>

</head>


<body>


<header class="header">


<a href="index.html">

<img
src="https://bikarantrade.github.io/bikaran-website/logo.png.jpeg"
class="logo"
alt="بیکران گسترش تجارت پارسی"
>

</a>


<button
type="button"
class="menu-button"
onclick="openMenu()"
aria-label="باز کردن منو"
>
