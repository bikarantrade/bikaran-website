<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
درخواست مشاوره | بیکران گسترش تجارت پارسی
</title>


<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;
}

body{

    background:#050505;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* =========================================
   PAGE
========================================= */

.page{

    min-height:100vh;

    padding:
        110px
        20px
        70px;

    position:relative;

    background:

        radial-gradient(
            circle at 50% 5%,
            rgba(212,168,79,.14) 0%,
            rgba(212,168,79,.05) 25%,
            transparent 55%
        ),

        linear-gradient(
            135deg,
            #151515 0%,
            #080808 50%,
            #020202 100%
        );
}


/* =========================================
   CONTAINER
========================================= */

.container{

    width:90%;

    max-width:760px;

    margin:auto;
}


/* =========================================
   TITLE
========================================= */

h1{

    margin:
        0 0 12px;

    text-align:center;

    color:#fff;

    font-size:
        clamp(
            35px,
            6vw,
            50px
        );

    line-height:1.5;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.8);
}

.subtitle{

    text-align:center;

    color:#d4a84f;

    font-size:17px;

    line-height:2;

    margin-bottom:35px;
}


/* =========================================
   FORM BOX
========================================= */

.form-box{

    background:

        linear-gradient(
            145deg,
            rgba(32,32,32,.97),
            rgba(8,8,8,.99)
        );

    border:
        1px solid
        rgba(212,168,79,.3);

    border-radius:16px;

    padding:32px;

    box-shadow:

        0 20px 55px
        rgba(0,0,0,.55),

        inset 0 1px 0
        rgba(255,255,255,.03);
}


/* =========================================
   FIELD
========================================= */

.field{

    margin-bottom:21px;
}


/* =========================================
   LABEL
========================================= */

label{

    display:block;

    color:#ddd;

    margin-bottom:9px;

    font-size:15px;

    font-weight:bold;
}


/* =========================================
   INPUT / SELECT / TEXTAREA
========================================= */

input,
select,
textarea{

    width:100%;

    padding:15px 16px;

    background:#111;

    color:#fff;

    border:
        1px solid
        #333;

    border-radius:9px;

    outline:none;

    font-family:inherit;

    font-size:15px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input::placeholder,
textarea::placeholder{

    color:#777;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#d4a84f;

    box-shadow:
        0 0 0 2px
        rgba(212,168,79,.08);
}


/* =========================================
   SELECT
========================================= */

select{

    cursor:pointer;

    appearance:auto;
}


/* =========================================
   TEXTAREA
========================================= */

textarea{

    min-height:145px;

    resize:vertical;

    line-height:2;
}


/* =========================================
   SUBMIT BUTTON
========================================= */

.submit{

    width:100%;

    border:0;

    border-radius:9px;

    padding:17px;

    background:#d4a84f;

    color:#111;

    font-family:inherit;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:
        transform .25s,
        background .25s,
        box-shadow .25s;

    box-shadow:
        0 8px 25px
        rgba(212,168,79,.12);
}

.submit:hover{

    transform:
        translateY(-3px);

    background:#e2b65d;

    box-shadow:
        0 12px 30px
        rgba(212,168,79,.2);
}


/* =========================================
   NOTE
========================================= */

.note{

    margin-top:15px;

    color:#888;

    font-size:13px;

    text-align:center;

    line-height:2;
}


/* =========================================
   HOME BUTTON
========================================= */

.home{

    display:block;

    width:max-content;

    margin:
        30px
        auto
        0;

    padding:
        14px
        30px;

    color:#d4a84f;

    border:
        1px solid
        #d4a84f;

    border-radius:9px;

    font-weight:bold;

    transition:.25s;
}

.home:hover{

    background:#d4a84f;

    color:#111;

    transform:
        translateY(-3px);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .page{

        padding:
            95px
            15px
            50px;
    }

    .container{

        width:96%;
    }

    h1{

        font-size:35px;
    }

    .subtitle{

        font-size:15px;

        margin-bottom:28px;
    }

    .form-box{

        padding:
            24px
            18px;
    }

    input,
    select,
    textarea{

        font-size:15px;
    }

    .home{

        width:100%;

        text-align:center;
    }

}

</style>

</head>


<body>


<section class="page">


<div class="container">


<h1>
درخواست مشاوره
</h1>


<div class="subtitle">

موضوع مشاوره خود را انتخاب کنید و
اطلاعات خود را وارد نمایید

</div>


<div class="form-box">


<form
id="consultationForm"
>


<!-- موضوع -->

<div class="field">

<label for="subject">
موضوع مشاوره
</label>

<select
id="subject"
required
>

<option value="">
انتخاب موضوع مشاوره
</option>

<option value="واردات">
واردات
</option>

<option value="صادرات">
صادرات
</option>

<option value="ترخیص کالا">
ترخیص کالا
</option>

<option value="امور گمرکی">
امور گمرکی
</option>

<option value="بازرگانی خارجی">
بازرگانی خارجی
</option>

<option value="آموزش امور تخصصی بازرگانی خارجی">
آموزش امور تخصصی بازرگانی خارجی
</option>

<option value="سایر">
سایر
</option>

</select>

</div>


<!-- نام -->

<div class="field">

<label for="name">
نام و نام خانوادگی
</label>

<input
type="text"
id="name"
placeholder="نام و نام خانوادگی خود را وارد کنید"
required
>

</div>


<!-- شماره -->

<div class="field">

<label for="phone">
شماره تماس
</label>

<input
type="tel"
id="phone"
placeholder="مثلاً 09123456789"
required
>

</div>


<!-- توضیحات -->

<div class="field">

<label for="message">
توضیحات درخواست
</label>

<textarea
id="message"
placeholder="توضیحات یا سوال خود را وارد کنید..."
></textarea>

</div>


<!-- ارسال -->

<button
type="submit"
class="submit"
>

ارسال درخواست از طریق واتساپ

</button>


<div class="note">

با زدن دکمه ارسال، واتساپ باز شده و
اطلاعات درخواست شما آماده ارسال می‌شود.

</div>


</form>


</div>


<a
href="https://bikarantrade.github.io/bikaran-website/"
class="home"
>

بازگشت به خانه

</a>


</div>

</section>



<script>

document
.getElementById("consultationForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const subject =
            document
            .getElementById("subject")
            .value;


        const name =
            document
            .getElementById("name")
            .value;


        const phone =
            document
            .getElementById("phone")
            .value;


        const message =
            document
            .getElementById("message")
            .value;


        const text =

`درخواست مشاوره جدید

موضوع مشاوره:
${subject}

نام و نام خانوادگی:
${name}

شماره تماس:
${phone}

توضیحات:
${message}`;


        /* شماره واتساپ مقصد */

        const whatsappNumber =
            "989125479907";


        const whatsappURL =

            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(text);


        window.open(
            whatsappURL,
            "_blank"
        );

    }
);

</script>


</body>

</html>
