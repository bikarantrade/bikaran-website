<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مدیریت اخبار | بیکران</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101010;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .box {
            background: #181818;
            border: 1px solid rgba(212,168,79,.25);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        h1,
        h2 {
            color: #d4a84f;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: #101010;
            color: #fff;
            border: 1px solid #333;
            border-radius: 10px;
            font-family: inherit;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #d4a84f;
            color: #111;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
        }

        .secondary {
            margin-top: 10px;
            background: #292929;
            color: #d4a84f;
        }

        .danger {
            background: #401818;
            color: #ff7777;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            background: rgba(212,168,79,.1);
            color: #d4a84f;
            line-height: 2;
        }

        .news-item {
            padding: 15px;
            border: 1px solid #333;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .news-item img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .news-item h3 {
            color: #d4a84f;
        }

        .news-item p {
            color: #aaa;
            line-height: 2;
        }

        .small {
            color: #777;
            font-size: 12px;
            line-height: 1.8;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- LOGIN -->

    <div
        id="loginBox"
        class="box"
    >

        <h1>
            مدیریت اخبار بیکران
        </h1>

        <p class="small">
            توکن GitHub مدیر را وارد کنید.
        </p>

        <label>
            GitHub Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="ghp_..."
        >

        <button id="loginButton">
            ورود
        </button>

        <div
            id="loginMessage"
            class="message hidden"
        ></div>

    </div>


    <!-- ADMIN -->

    <div
        id="adminPanel"
        class="hidden"
    >


        <div class="box">

            <h2>
                انتشار خبر جدید
            </h2>


            <label>
                عنوان خبر
            </label>

            <input
                id="newsTitle"
                type="text"
                placeholder="عنوان خبر"
            >


            <label>
                تاریخ خبر
            </label>

            <input
                id="newsDate"
                type="text"
                placeholder="۲۸ مرداد ۱۴۰۵"
            >


            <label>
                متن خبر
            </label>

            <textarea
                id="newsText"
                placeholder="متن کامل خبر..."
            ></textarea>


            <label>
                تصویر خبر
            </label>

            <input
                id="newsImage"
                type="file"
                accept="image/*"
            >


            <button id="publishButton">
                انتشار خبر
            </button>


            <div
                id="status"
                class="message hidden"
            ></div>

        </div>


        <div class="box">

            <h2>
                اخبار منتشرشده
            </h2>

            <div id="newsList">
                در حال دریافت...
            </div>

        </div>


        <button
            id="logoutButton"
            class="secondary"
        >
            خروج از پنل
        </button>


    </div>

</div>



<script>


/* =========================
   تنظیمات سایت
========================= */

const OWNER =
    "melinaamiri91";

const REPOSITORY =
    "bikaran-website";

const BRANCH =
    "main";

const NEWS_FOLDER =
    "content/news";

const IMAGE_FOLDER =
    "images/news";


let token =
    localStorage.getItem(
        "bikaran_admin_token"
    );



/* =========================
   عناصر صفحه
========================= */

const loginBox =
    document.getElementById(
        "loginBox"
    );

const adminPanel =
    document.getElementById(
        "adminPanel"
    );

const tokenInput =
    document.getElementById(
        "token"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

const status =
    document.getElementById(
        "status"
    );



/* =========================
   درخواست به GitHub
========================= */

async function github(
    url,
    method = "GET",
    body = null
) {

    const headers = {

        "Accept":
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"

    };


    if (token) {

        headers.Authorization =
            "Bearer " + token;

    }


    const response =
        await fetch(
            "https://api.github.com" + url,
            {

                method:
                    method,

                headers:
                    headers,

                body:
                    body
                    ?
                    JSON.stringify(body)
                    :
                    undefined

            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            errorText
        );

    }


    return response.json();

}



/* =========================
   ورود
========================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        async function() {


            const enteredToken =
                tokenInput
                    .value
                    .trim();


            if (!enteredToken) {

                showLoginMessage(
                    "توکن را وارد کنید."
                );

                return;

            }


            try {


                const oldToken =
                    token;


                token =
                    enteredToken;


                await github(
                    "/user"
                );


                localStorage.setItem(
                    "bikaran_admin_token",
                    token
                );


                loginBox
                    .classList
                    .add("hidden");


                adminPanel
                    .classList
                    .remove("hidden");


                loadNews();


            } catch (error) {

                token =
                    oldToken;


                showLoginMessage(
                    "توکن اشتباه است یا دسترسی لازم را ندارد."
                );

            }

        }
    );



/* =========================
   ورود خودکار
========================= */

if (token) {

    github("/user")
        .then(
            function() {

                loginBox
                    .classList
                    .add("hidden");

                adminPanel
                    .classList
                    .remove("hidden");

                loadNews();

            }
        )
        .catch(
            function() {

                localStorage.removeItem(
                    "bikaran_admin_token"
                );

                token = null;

            }
        );

}



/* =========================
   انتشار خبر
========================= */

document
    .getElementById("publishButton")
    .addEventListener(
        "click",
        publishNews
    );



async function publishNews() {


    const title =
        document
            .getElementById("newsTitle")
            .value
            .trim();


    const date =
        document
            .getElementById("newsDate")
            .value
            .trim();


    const text =
        document
            .getElementById("newsText")
            .value
            .trim();


    const image =
        document
            .getElementById("newsImage")
            .files[0];


    if (
        !title ||
        !date ||
        !text
    ) {

        showStatus(
            "عنوان، تاریخ و متن خبر را وارد کنید."
        );

        return;

    }


    const button =
        document.getElementById(
            "publishButton"
        );


    button.disabled = true;

    button.textContent =
        "در حال انتشار...";


    try {


        let imageURL = "";


        /* =====================
           آپلود عکس
        ===================== */

        if (image) {


            const base64 =
                await fileToBase64(
                    image
                );


            const fileName =
                Date.now() +
                "-" +
                cleanFileName(
                    image.name
                );


            const imagePath =
                IMAGE_FOLDER +
                "/" +
                fileName;


            await github(
                `/repos/${OWNER}/${REPOSITORY}/contents/${imagePath}`,
                "PUT",
                {

                    message:
                        "افزودن تصویر خبر",

                    content:
                        base64,

                    branch:
                        BRANCH

                }
            );


            imageURL =
                "/bikaran-website/" +
                imagePath;

        }



        /* =====================
           ساخت فایل خبر
        ===================== */

        const fileName =
            Date.now() +
            "-" +
            slug(title) +
            ".md";


        const newsPath =
            NEWS_FOLDER +
            "/" +
            fileName;


        const markdown =
`---
title: "${yaml(title)}"
date: "${yaml(date)}"
image: "${yaml(imageURL)}"
---

${text}`;


        const encoded =
            utf8ToBase64(
                markdown
            );


        await github(
            `/repos/${OWNER}/${REPOSITORY}/contents/${newsPath}`,
            "PUT",
            {

                message:
                    "افزودن خبر: " +
                    title,

                content:
                    encoded,

                branch:
                    BRANCH

            }
        );


        showStatus(
            "✅ خبر با موفقیت منتشر شد."
        );


        document
            .getElementById(
                "newsTitle"
            )
            .value = "";


        document
            .getElementById(
                "newsDate"
            )
            .value = "";


        document
            .getElementById(
                "newsText"
            )
            .value = "";


        document
            .getElementById(
                "newsImage"
            )
            .value = "";


        setTimeout(
            loadNews,
            3000
        );


    } catch (error) {

        console.error(error);


        showStatus(
            "❌ خطا در انتشار خبر."
        );

    }


    button.disabled = false;

    button.textContent =
        "انتشار خبر";

}



/* =========================
   دریافت اخبار
========================= */

async function loadNews() {


    const list =
        document.getElementById(
            "newsList"
        );


    list.innerHTML =
        "در حال دریافت اخبار...";


    try {


        const files =
            await github(
                `/repos/${OWNER}/${REPOSITORY}/contents/${NEWS_FOLDER}?ref=${BRANCH}`
            );


        list.innerHTML =
            "";


        for (
            const file of files
        ) {


            if (
                !file.name.endsWith(
                    ".md"
                )
            ) {

                continue;

            }


            const data =
                await github(
                    `/repos/${OWNER}/${REPOSITORY}/contents/${file.path}`
                );


            const markdown =
                decodeBase64(
                    data.content
                );


            const news =
                parseNews(
                    markdown
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "news-item";


            item.innerHTML = `

                ${
                    news.image
                    ?
                    `<img src="${escapeHTML(news.image)}">`
                    :
                    ""
                }

                <h3>
                    ${escapeHTML(news.title)}
                </h3>

                <div class="small">
                    ${escapeHTML(news.date)}
                </div>

                <p>
                    ${escapeHTML(news.text)}
                </p>

            `;


            list.appendChild(
                item
            );

        }


        if (!list.innerHTML) {

            list.innerHTML =
                "هنوز خبری منتشر نشده.";

        }


    } catch (error) {

        list.innerHTML =
            "خطا در دریافت اخبار.";

    }

}



/* =========================
   تبدیل عکس
========================= */

function fileToBase64(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                            .split(",")[1]
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =========================
   ساخت slug
========================= */

function slug(
    text
) {

    return text
        .replace(
            /[^\w\u0600-\u06FF]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        )
        .substring(
            0,
            50
        );

}



/* =========================
   نام فایل عکس
========================= */

function cleanFileName(
    name
) {

    return name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
        );

}



/* =========================
   YAML
========================= */

function yaml(
    text
) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /"/g,
            '\\"'
        );

}



/* =========================
   UTF8 → Base64
========================= */

function utf8ToBase64(
    text
) {

    return btoa(
        unescape(
            encodeURIComponent(
                text
            )
        )
    );

}



/* =========================
   Base64 → UTF8
========================= */

function decodeBase64(
    text
) {

    return decodeURIComponent(
        escape(
            atob(
                text.replace(
                    /\n/g,
                    ""
                )
            )
        )
    );

}



/* =========================
   خواندن Markdown
========================= */

function parseNews(
    markdown
) {


    const parts =
        markdown.split(
            "---"
        );


    if (
        parts.length < 3
    ) {

        return {

            title:
                "خبر",

            date:
                "",

            image:
                "",

            text:
                markdown

        };

    }


    const front =
        parts[1];


    const text =
        parts
            .slice(2)
            .join("---")
            .trim();


    function get(
        key
    ) {

        const regex =
            new RegExp(
                "^" +
                key +
                ":\\s*[\"']?(.*?)[\"']?$",
                "m"
            );


        const result =
            front.match(
                regex
            );


        return result
            ?
            result[1]
            :
            "";

    }


    return {

        title:
            get("title"),

        date:
            get("date"),

        image:
            get("image"),

        text:
            text

    };

}



/* =========================
   HTML امن
========================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}



/* =========================
   پیام
========================= */

function showStatus(
    message
) {

    status.textContent =
        message;


    status.classList.remove(
        "hidden"
    );

}



/* =========================
   پیام ورود
========================= */

function showLoginMessage(
    message
) {

    loginMessage.textContent =
        message;


    loginMessage.classList.remove(
        "hidden"
    );

}



/* =========================
   خروج
========================= */

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "bikaran_admin_token"
            );

            location.reload();

        }
    );

</script>


</body>

</html>
