<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مدیریت اخبار | بیکران</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101010;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        .box {
            background: #181818;
            border: 1px solid rgba(212,168,79,.25);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        h1,
        h2 {
            color: #d4a84f;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            background: #101010;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-family: inherit;
        }

        textarea {
            min-height: 180px;
            line-height: 2;
        }

        label {
            color: #ddd;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #d4a84f;
            color: #111;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
        }

        .secondary {
            background: #252525;
            color: #d4a84f;
            margin-top: 10px;
        }

        .danger {
            background: #351818;
            color: #ff7777;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(212,168,79,.1);
            color: #d4a84f;
            line-height: 2;
        }

        .news {
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .news img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .news h3 {
            color: #d4a84f;
        }

        .news p {
            color: #bbb;
            line-height: 2;
        }

        .small {
            color: #777;
            font-size: 12px;
            line-height: 1.8;
        }

    </style>

</head>

<body>

<div class="container">


    <!-- TOKEN -->

    <div
        class="box"
        id="loginBox"
    >

        <h1>
            مدیریت اخبار بیکران
        </h1>

        <p class="small">
            برای استفاده از پنل، توکن GitHub مدیر را وارد کنید.
        </p>

        <label>
            GitHub Token
        </label>

        <input
            type="password"
            id="token"
            placeholder="ghp_..."
        >

        <button id="loginBtn">
            ورود به پنل
        </button>

        <div
            id="loginMessage"
            class="message hidden"
        ></div>

    </div>



    <!-- ADMIN -->

    <div
        class="hidden"
        id="adminPanel"
    >


        <div class="box">

            <h2>
                افزودن خبر جدید
            </h2>


            <label>
                عنوان خبر
            </label>

            <input
                id="title"
                placeholder="عنوان خبر"
            >


            <label>
                تاریخ
            </label>

            <input
                id="date"
                placeholder="مثلاً ۲۸ مرداد ۱۴۰۵"
            >


            <label>
                متن خبر
            </label>

            <textarea
                id="description"
                placeholder="متن کامل خبر..."
            ></textarea>


            <label>
                تصویر خبر
            </label>

            <input
                type="file"
                id="image"
                accept="image/*"
            >


            <button
                id="publishBtn"
            >
                انتشار خبر
            </button>


            <div
                id="status"
                class="message hidden"
            ></div>

        </div>



        <div class="box">

            <h2>
                اخبار منتشرشده
            </h2>

            <div id="newsList">
                در حال دریافت...
            </div>

        </div>


        <button
            class="secondary"
            id="logoutBtn"
        >
            خروج
        </button>


    </div>

</div>


<script>


const REPO =
    "melinaamiri91/bikaran-website";


const BRANCH =
    "main";


const NEWS_PATH =
    "content/news";


const IMAGE_PATH =
    "images/news";



let token =
    localStorage.getItem(
        "bikaran_github_token"
    );



const loginBox =
    document.getElementById(
        "loginBox"
    );


const adminPanel =
    document.getElementById(
        "adminPanel"
    );


const tokenInput =
    document.getElementById(
        "token"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const status =
    document.getElementById(
        "status"
    );



/* =========================
   LOGIN
========================= */

document
    .getElementById("loginBtn")
    .addEventListener(
        "click",
        async function() {

            const value =
                tokenInput
                    .value
                    .trim();


            if (!value) {

                showLoginMessage(
                    "توکن را وارد کنید."
                );

                return;

            }


            try {

                const response =
                    await github(
                        "/user",
                        "GET",
                        null,
                        value
                    );


                if (!response.login) {

                    throw new Error();

                }


                token =
                    value;


                localStorage.setItem(
                    "bikaran_github_token",
                    token
                );


                showAdmin();


            } catch (error) {

                showLoginMessage(
                    "توکن GitHub صحیح نیست یا دسترسی لازم را ندارد."
                );

            }

        }
    );



/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

    loginBox.classList.add(
        "hidden"
    );


    adminPanel.classList.remove(
        "hidden"
    );


    loadNews();

}



/* =========================
   AUTO LOGIN
========================= */

if (token) {

    github(
        "/user",
        "GET",
        null,
        token
    )
    .then(
        function() {

            showAdmin();

        }
    )
    .catch(
        function() {

            localStorage.removeItem(
                "bikaran_github_token"
            );

        }
    );

}



/* =========================
   PUBLISH
========================= */

document
    .getElementById("publishBtn")
    .addEventListener(
        "click",
        publishNews
    );



async function publishNews() {


    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const date =
        document
            .getElementById("date")
            .value
            .trim();


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const imageFile =
        document
            .getElementById("image")
            .files[0];


    if (
        !title ||
        !date ||
        !description
    ) {

        showStatus(
            "عنوان، تاریخ و متن خبر را وارد کنید."
        );

        return;

    }


    const button =
        document.getElementById(
            "publishBtn"
        );


    button.disabled = true;

    button.textContent =
        "در حال انتشار...";


    try {


        let imageURL = "";


        /* IMAGE */

        if (imageFile) {

            const imageData =
                await fileToBase64(
                    imageFile
                );


            const safeName =
                createFileName(
                    imageFile.name
                );


            const imagePath =
                `${IMAGE_PATH}/${Date.now()}-${safeName}`;


            await createGitHubFile(
                imagePath,
                imageData,
                `افزودن تصویر خبر: ${title}`
            );


            imageURL =
                `/bikaran-website/${imagePath}`;

        }



        /* NEWS */

        const slug =
            createSlug(
                title
            );


        const filePath =
            `${NEWS_PATH}/${Date.now()}-${slug}.md`;


        const markdown =
`---
title: "${yamlEscape(title)}"
date: "${yamlEscape(date)}"
image: "${yamlEscape(imageURL)}"
---

${description}
`;


        const content =
            btoa(
                unescape(
                    encodeURIComponent(
                        markdown
                    )
                )
            );


        await createGitHubFile(
            filePath,
            content,
            `افزودن خبر: ${title}`
        );


        showStatus(
            "خبر با موفقیت منتشر شد. چند لحظه بعد در سایت نمایش داده می‌شود."
        );


        document
            .getElementById("title")
            .value = "";


        document
            .getElementById("date")
            .value = "";


        document
            .getElementById("description")
            .value = "";


        document
            .getElementById("image")
            .value = "";


        setTimeout(
            loadNews,
            3000
        );


    } catch (error) {

        console.error(error);

        showStatus(
            "خطا در انتشار خبر: " +
            error.message
        );

    }


    button.disabled = false;

    button.textContent =
        "انتشار خبر";

}



/* =========================
   LOAD NEWS
========================= */

async function loadNews() {

    const list =
        document.getElementById(
            "newsList"
        );


    list.innerHTML =
        "در حال دریافت اخبار...";


    try {


        const files =
            await github(
                `/repos/${REPO}/contents/${NEWS_PATH}?ref=${BRANCH}`,
                "GET"
            );


        if (!Array.isArray(files)) {

            list.innerHTML =
                "هنوز خبری وجود ندارد.";

            return;

        }


        list.innerHTML =
            "";


        for (
            const file of files
        ) {


            if (
                !file.name.endsWith(
                    ".md"
                )
            ) {

                continue;

            }


            const data =
                await github(
                    `/repos/${REPO}/contents/${file.path}?ref=${BRANCH}`,
                    "GET"
                );


            const markdown =
                decodeBase64(
                    data.content
                );


            const news =
                parseMarkdown(
                    markdown
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "news";


            div.innerHTML = `

                ${
                    news.image
                    ?
                    `<img src="${escapeHTML(news.image)}">`
                    :
                    ""
                }

                <h3>
                    ${escapeHTML(news.title)}
                </h3>

                <div class="small">
                    ${escapeHTML(news.date)}
                </div>

                <p>
                    ${escapeHTML(news.body)}
                </p>

            `;


            list.appendChild(
                div
            );

        }


        if (!list.innerHTML) {

            list.innerHTML =
                "هنوز خبری وجود ندارد.";

        }


    } catch (error) {

        console.error(error);

        list.innerHTML =
            "خطا در دریافت اخبار.";

    }

}



/* =========================
   CREATE GITHUB FILE
========================= */

async function createGitHubFile(
    path,
    content,
    message
) {

    return github(
        `/repos/${REPO}/contents/${path}`,
        "PUT",
        {
            message:
                message,

            content:
                content,

            branch:
                BRANCH
        }
    );

}



/* =========================
   GITHUB API
========================= */

async function github(
    endpoint,
    method = "GET",
    body = null,
    customToken = null
) {


    const headers = {

        Accept:
            "application/vnd.github+json",

        "X-GitHub-Api-Version":
            "2022-11-28"

    };


    const activeToken =
        customToken || token;


    if (activeToken) {

        headers.Authorization =
            `Bearer ${activeToken}`;

    }


    const response =
        await fetch(
            "https://api.github.com" +
            endpoint,
            {

                method:
                    method,

                headers:
                    headers,

                body:
                    body
                    ?
                    JSON.stringify(body)
                    :
                    undefined

            }
        );


    if (!response.ok) {

        const text =
            await response.text();


        throw new Error(
            text
        );

    }


    return response.json();

}



/* =========================
   FILE → BASE64
========================= */

function fileToBase64(
    file
) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    const result =
                        reader.result;


                    const base64 =
                        result.split(
                            ","
                        )[1];


                    resolve(
                        base64
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =========================
   HELPERS
========================= */

function createSlug(
    text
) {

    return text
        .toLowerCase()
        .replace(
            /[^\w\u0600-\u06FF]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        )
        .substring(
            0,
            60
        );

}


function createFileName(
    name
) {

    return name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
        );

}


function yamlEscape(
    text
) {

    return text
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /"/g,
            '\\"'
        );

}


function decodeBase64(
    base64
) {

    return decodeURIComponent(
        escape(
            atob(
                base64.replace(
                    /\n/g,
                    ""
                )
            )
        )
    );

}


function parseMarkdown(
    markdown
) {

    const match =
        markdown.match(
            /^---([\s\S]*?)---([\s\S]*)$/
        );


    if (!match) {

        return {

            title:
                "بدون عنوان",

            date:
                "",

            image:
                "",

            body:
                markdown

        };

    }


    const front =
        match[1];


    const body =
        match[2].trim();


    const get =
        function(
            key
        ) {

            const regex =
                new RegExp(
                    "^" +
                    key +
                    ":\\s*[\"']?(.*?)[\"']?$",
                    "m"
                );


            const found =
                front.match(
                    regex
                );


            return found
                ?
                found[1]
                :
                "";

        };


    return {

        title:
            get("title"),

        date:
            get("date"),

        image:
            get("image"),

        body:
            body

    };

}


function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


function showStatus(
    text
) {

    status.textContent =
        text;


    status.classList.remove(
        "hidden"
    );

}


function showLoginMessage(
    text
) {

    loginMessage.textContent =
        text;


    loginMessage.classList.remove(
        "hidden"
    );

}


document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "bikaran_github_token"
            );

            location.reload();

        }
    );


</script>

</body>

</html>
