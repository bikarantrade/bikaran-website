<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار | بیکران</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Tahoma,Arial,sans-serif}
.page{min-height:100vh;padding:110px 20px}
.container{max-width:1000px;width:90%;margin:auto}
h1{text-align:center;font-size:42px}
.gold{text-align:center;color:#d4a84f;margin-bottom:45px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:25px}
.card h2{color:#d4a84f;font-size:19px;line-height:1.8}
.card p{color:#ccc;line-height:2}
.home{display:block;width:max-content;margin:45px auto;padding:15px 30px;background:#d4a84f;color:#111;border-radius:8px;font-weight:bold}
@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>

<body>

<section class="page">
<div class="container">

<h1>اخبار</h1>

<div class="gold">
آخرین اخبار و مطالب بازرگانی
</div>

<div class="grid">

<div class="card">
<h2>اخبار بازرگانی</h2>
<p>
آخرین مطالب و تحولات حوزه تجارت و بازرگانی.
</p>
</div>

<div class="card">
<h2>بازرگانی خارجی</h2>
<p>
مطالب و اطلاعات تخصصی مرتبط با واردات و صادرات.
</p>
</div>

<div class="card">
<h2>اطلاعیه‌های بیکران</h2>
<p>
اخبار و اطلاعیه‌های مجموعه بیکران گسترش تجارت پارسی.
</p>
</div>

</div>

<a href="index.html" class="home">
بازگشت به خانه
</a>

</div>
</section>

</body>
</html>
